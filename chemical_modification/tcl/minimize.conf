structure          QB_naa_capsid_wb.psf
coordinates        QB_naa_capsid_wb.pdb
set temperature    300  ;# target temperature used several times below
# starting from scratch
temperature         $temperature    ;# initialize velocities randomly
outputName         par_test  ;# base name for output from this run
restartfreq         5000     ;# 500 steps
dcdfreq             100
xstFreq             1000
outputEnergies      5000     ;# 100 steps = every 0.2 ps
outputTiming       5000     ;# shows time per step and time to completion
# Force-Field Parameters
paraTypeCharmm	    on
parameters          par_all36_cgenff.prm
parameters          par_all36m_prot.prm
parameters          par_GUI.prm
parameters          par_water_ions.inp          #parameters for water and ions

# These are specified by CHARMM
exclude             scaled1-4
1-4scaling          1.0
switching           on

# You have some freedom choosing the cutoff
cutoff              12. ;# may use smaller, maybe 10., with PME
switchdist          10. ;# cutoff - 2.

# Promise that atom won't move more than 2A in a cycle
pairlistdist        14. ;# cutoff + 2.
stepspercycle       20   ;# redo pairlists every ten steps
# Integrator Parameters
timestep            0.5  ;# 1fs/step
rigidBonds          water  ;# 
nonbondedFreq       2    ;# nonbonded forces every step
fullElectFrequency  4    ;# PME only every other step
# Constant Temperature Control
langevin            on            ;# langevin dynamics
langevinDamping     1.            ;# damping coefficient of 1/ps
langevinTemp        $temperature  ;# random noise at this level
langevinHydrogen    no            ;# don't couple bath to hydrogens
# Periodic Boundary conditions
cellBasisVector1   320.0 0.   0.  ;# vector to the next image
cellBasisVector2     0. 320. 0.
cellBasisVector3     0.    0.  320.
cellOrigin           74.0   0.00  0.00 ;# the *center* of the cell
wrapWater           on              ;# wrap water to central cell
wrapAll             on              ;# wrap other molecules too
wrapNearest         off             ;# use for non-rectangular cells
#PME (for full-system periodic electrostatics)
PME                 yes
# let NAMD determine grid
PMEGridSpacing      1.0
# Constant Pressure Control (variable volume)
useGroupPressure      yes ;# needed for rigid bonds
langevinPiston        on
useFlexibleCell       yes
useConstantRatio      yes
langevinPistonTarget  1.01325      ;# pressure in bar -> 1 atm
langevinPistonPeriod  4000.         ;# oscillation period around 100 fs
langevinPistonDecay   2000.          ;# oscillation decay time of 50 fs
langevinPistonTemp    $temperature ;# coupled to heat bath

margin 5


minimize            800         ;# lower potential energy for 1000 steps
reinitvels          $temperature  ;# since minimization zeros velocities

run 1000
