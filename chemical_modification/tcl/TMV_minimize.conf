# TMV_minimize.conf
# Minimisation + short NPT equilibration of the solvated TMV rod (49 subunits).
# Box dimensions taken from TMV_naa_capsid_wb.pdb CRYST1 record:
#   209.15 x 209.14 x 121.10 Å  (rod axis along Z)
# Cell origin is the geometric centre of the rod: (0, 0, 0) after solvation.

structure          TMV_naa_capsid_wb.psf
coordinates        TMV_naa_capsid_wb.pdb

set temperature    300
temperature         $temperature

outputName         TMV_min_out
restartfreq         5000
dcdfreq             100
xstFreq             1000
outputEnergies      5000
outputTiming        5000

# Force-Field Parameters
paraTypeCharmm      on
parameters          par_all36_cgenff.prm
parameters          par_all36m_prot.prm
parameters          par_GUI.prm
parameters          par_water_ions.inp

exclude             scaled1-4
1-4scaling          1.0
switching           on
cutoff              12.
switchdist          10.
pairlistdist        14.
stepspercycle       20

timestep            0.5
rigidBonds          water
nonbondedFreq       2
fullElectFrequency  4

# Constant Temperature
langevin            on
langevinDamping     1.
langevinTemp        $temperature
langevinHydrogen    no

# Periodic Boundary Conditions  (rectangular; rod along Z)
# The GUI runs `python3 capsid_cell.py TMV_naa_capsid_wb.pdb` first, which reads
# the box from the CRYST1 record and centres the cell on the solvated rod. The
# literal values are the fallback for running this conf by hand.
if {[file exists TMV_naa_capsid_wb_cell.namd]} {
    source TMV_naa_capsid_wb_cell.namd
} else {
    cellBasisVector1   209.15   0.      0.
    cellBasisVector2     0.    209.14   0.
    cellBasisVector3     0.      0.    121.10
    cellOrigin           0.      0.     36.2   ;# centre of the solvated rod
}

wrapWater           on
wrapAll             on
wrapNearest         off

PME                 yes
PMEGridSpacing      1.0

useGroupPressure      yes
langevinPiston        on
useFlexibleCell       yes
useConstantRatio      yes
langevinPistonTarget  1.01325
langevinPistonPeriod  4000.
langevinPistonDecay   2000.
langevinPistonTemp    $temperature

margin 5

minimize            800
reinitvels          $temperature

run 1000
