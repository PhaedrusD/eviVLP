structure          naa_test.psf
coordinates        naa_test.pdb
set temperature    300

temperature         $temperature

outputName         naa_test_out
restartfreq         100
dcdfreq             50
xstFreq             100
outputEnergies      100
outputTiming        100

# Force-Field Parameters
paraTypeCharmm	    on
parameters          par_all36_cgenff.prm
parameters          par_all36m_prot.prm
parameters          par_GUI.prm


exclude             scaled1-4
1-4scaling          1.0
switching           on

cutoff              12.
switchdist          10.
pairlistdist        14.
stepspercycle       20

timestep            0.50
nonbondedFreq       2
fullElectFrequency  4

langevin            on
langevinDamping     1.
langevinTemp        $temperature
langevinHydrogen    no

cellBasisVector1    50.0  0.0  0.0
cellBasisVector2     0.0 50.0  0.0
cellBasisVector3     0.0  0.0 50.0
cellOrigin           0.0  0.0  0.0

PME                 yes
PMEGridSpacing      1.0

minimize            500
reinitvels          $temperature
run                 1000
