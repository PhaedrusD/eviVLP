# minimize_monomer.conf - generated from minimize_monomer_template.conf
#
# Relieve the geometry guesscoord built for the modified residues, with every
# protein atom FIXED so the backbone cannot move. The capsid is assembled by
# applying crystallographic symmetry matrices to this monomer, so the backbone
# must stay exactly where the crystal put it.
#
# Non-periodic, no solvent: this is geometry relief, not conformational
# sampling. Clashes BETWEEN neighbouring subunits' adducts can only appear once
# the capsid is assembled - that is what the capsid minimisation is for.

structure          {{STEM}}.psf
coordinates        {{STEM}}.pdb
outputName         {{STEM}}_min
set temperature    300
temperature         $temperature 
paraTypeCharmm     on
# par_GUI.prm is read LAST on purpose: a later file overrides an earlier one for
# the same term, and our novel/cross-force-field parameters must win. Reading
# cgenff afterwards was observed to replace them ("IDENTICAL PERIODICITY!
# REPLACING OLD VALUES").
parameters         par_all36m_prot.prm
parameters         par_all36_cgenff.prm
parameters         par_GUI.prm

exclude            scaled1-4
1-4scaling         1.0
switching          on
cutoff             12.
switchdist         10.
pairlistdist       14.
stepspercycle      20

# only the modified residues move
fixedAtoms         on
fixedAtomsFile     {{STEM}}_fix.pdb
fixedAtomsCol      B

minimize           1000
